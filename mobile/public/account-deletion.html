<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Engineering Academy Hesap Silme Talebi</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #111; background: #f7f7f8; }
      main { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
      form, section { background: #fff; border: 1px solid #e3e3e7; border-radius: 18px; padding: 24px; margin: 16px 0; }
      h1 { font-size: 34px; line-height: 1.1; margin: 0 0 12px; }
      label { display: block; font-weight: 800; margin: 16px 0 6px; }
      input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #d7d7dc; border-radius: 12px; padding: 12px; font: inherit; }
      button { margin-top: 18px; border: 0; border-radius: 14px; padding: 14px 18px; background: #111; color: #fff; font-weight: 900; cursor: pointer; }
      p, li { line-height: 1.65; }
      .status { font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hesap Silme Talebi</h1>
      <p>AI Engineering Academy hesabının ve ilişkili uygulama verilerinin silinmesini buradan talep edebilirsin. Aboneliğin varsa Google Play üzerinden ayrıca iptal etmen gerekir.</p>
      <form id="delete-form">
        <label for="email">Hesap e-postası</label>
        <input id="email" name="email" type="email" required placeholder="ornek@eposta.com" />
        <label for="reason">Açıklama (isteğe bağlı)</label>
        <textarea id="reason" name="reason" rows="4" placeholder="Talebinle ilgili ek bilgi"></textarea>
        <button type="submit">Silme Talebi Gönder</button>
        <p id="status" class="status" role="status"></p>
      </form>
      <section>
        <p>Form çalışmazsa aynı talebi <a href="mailto:support@aiengineeringacademy.app">support@aiengineeringacademy.app</a> adresine e-posta göndererek iletebilirsin.</p>
      </section>
    </main>
    <script>
      const form = document.getElementById('delete-form');
      const statusEl = document.getElementById('status');
      const endpoint = window.AEA_DELETE_ENDPOINT || 'https://zopvlatemtixpgbhieam.supabase.co/functions/v1/request-account-deletion';

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        statusEl.textContent = 'Talep gönderiliyor...';
        const formData = new FormData(form);
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: formData.get('email'),
              reason: formData.get('reason'),
              requestedFrom: 'web',
            }),
          });
          if (!response.ok) throw new Error('request_failed');
          statusEl.textContent = 'Silme talebin alındı. Destek ekibi süreci başlatacak.';
          form.reset();
        } catch {
          statusEl.textContent = 'Talep gönderilemedi. Lütfen support@aiengineeringacademy.app adresine e-posta gönder.';
        }
      });
    </script>
  </body>
</html>
